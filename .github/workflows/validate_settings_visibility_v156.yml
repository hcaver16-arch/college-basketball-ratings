name: Validate V156 settings visibility
on:
  pull_request:
    paths:
      - app.py
      - test_settings_visibility_v156.py
      - .github/workflows/validate_settings_visibility_v156.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile app.py
      - run: python test_settings_visibility_v156.py
