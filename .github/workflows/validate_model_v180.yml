name: V180 model validation (read-only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - validate_model_v180.py
      - .github/workflows/validate_model_v180.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - name: Validate engine and locked forecasts
        run: python validate_model_v180.py
