name: Validate V152 tournament advancement
on:
  workflow_dispatch:
  pull_request:
    paths:
      - tournament_advancement_v152.py
      - tournament_native_v142.py
      - test_tournament_advancement_v152.py
      - .github/workflows/validate_tournament_advancement_v152.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas
      - run: python -m py_compile tournament_advancement_v152.py tournament_native_v142.py
      - run: python test_tournament_advancement_v152.py
