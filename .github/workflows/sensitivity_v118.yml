name: Research previous-date rating sensitivity V118
on:
  workflow_dispatch:
    inputs:
      max_games_per_stratum:
        description: 'Late-season evidence-matched target games per season/division (1–150)'
        required: false
        default: '16'
permissions:
  contents: read
jobs:
  retrospective:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific solver
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Run read-only sensitivity experiment
        env:
          MAX_GAMES: ${{ inputs.max_games_per_stratum }}
        run: |
          python sensitivity_v118.py --max-games-per-stratum "${MAX_GAMES:-16}" --output data/sensitivity_v118
      - name: Upload research report (no repository commits)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: courtside-v118-sensitivity-report
          path: data/sensitivity_v118/
          if-no-files-found: warn
