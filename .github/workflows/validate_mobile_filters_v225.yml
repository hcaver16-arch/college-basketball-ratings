name: Validate V225 mobile compact filters
on:
  pull_request:
    paths:
      - app.py
      - mobile_filters_v225.py
      - rankings_ui.py
      - conferences_ui.py
      - strength_comparison_v215.py
      - bracketology_v138.py
      - tournament_native_v142.py
      - model_lab_center_v218.py
      - test_mobile_filters_v225.py
      - test_games_scoreboard_v182.py
      - .github/workflows/validate_mobile_filters_v225.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py mobile_filters_v225.py rankings_ui.py conferences_ui.py strength_comparison_v215.py bracketology_v138.py tournament_native_v142.py model_lab_center_v218.py
      - run: python test_mobile_filters_v225.py
      - run: python test_games_scoreboard_v182.py
      - run: python test_ranked_games_filter_v211.py
      - run: python test_rankings_tiles_v195.py
      - run: python test_strength_side_by_side_v215.py
      - run: python test_conferences_ui_v212.py
      - run: python test_tournament_tabs_v197.py
      - run: python test_tournament_native_v142.py
      - run: python test_model_lab_dashboard_v218.py
