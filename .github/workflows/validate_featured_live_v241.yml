name: V241 featured matchup stays visible live and final
on:
  pull_request:
    paths:
      - courtside_home.py
      - test_featured_live_v241.py
      - test_home_unified_v221.py
      - test_home_tiles_v223.py
      - test_home_spacing_v222.py
      - .github/workflows/validate_featured_live_v241.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pandas>=2.1,<3'
      - name: Validate homepage render source and status persistence
        run: |
          python -m py_compile courtside_home.py test_featured_live_v241.py
          python test_featured_live_v241.py
      - name: Preserve existing scoreboard, logos, responsive layout and navigation
        run: |
          python test_home_game_scorecards_v224.py
          python test_home_tiles_v223.py
          python test_home_spacing_v222.py
          python test_home_unified_v221.py
          python test_featured_logos_v178.py
          python test_games_first_home_v169.py
          python test_live_home_v175.py
          python test_adaptive_home_v170.py
          python test_home_finish_v176.py
          python test_home_timezone_hot_reload.py
