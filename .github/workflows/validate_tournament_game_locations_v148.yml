name: Validate V148 game-level tournament locations
on:
  pull_request:
    paths:
      - tournament_region_labels_v147.py
      - tournament_native_v142.py
      - tournament_full_v144.py
      - test_tournament_game_locations_v148.py
      - .github/workflows/validate_tournament_game_locations_v148.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python test_tournament_game_locations_v148.py
