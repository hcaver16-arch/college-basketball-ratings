name: Validate V230 matchup recent season results
on:
  pull_request:
    paths:
      - matchup_analysis.py
      - app.py
      - test_matchup_recent_v230.py
      - .github/workflows/validate_matchup_recent_v230.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pandas>=2.1,<3'
      - run: python -m py_compile matchup_analysis.py app.py
      - run: python test_matchup_recent_v230.py
