name: Research expanded venue sensitivity V120
on:
  workflow_dispatch:
    inputs:
      per_stratum:
        description: 'Total evidence target per season/division (includes existing V117 games)'
        required: true
        default: '600'
      max_new:
        description: 'Maximum new ESPN requests this run (0-300)'
        required: true
        default: '200'
      max_targets:
        description: 'Maximum late-season evaluation targets per season/division'
        required: true
        default: '120'
permissions:
  contents: write
concurrency:
  group: courtside-research-v120-checkpoint
  cancel-in-progress: false
jobs:
  coverage-and-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research math dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.24,<3' 'scipy>=1.10,<2'
      - name: Collect evidence and evaluate venue-aware variants
        env:
          PER_STRATUM: ${{ inputs.per_stratum }}
          MAX_NEW: ${{ inputs.max_new }}
          MAX_TARGETS: ${{ inputs.max_targets }}
        run: |
          python expand_and_compare_v120.py --root . --output data/research_v120 \
            --per-stratum "$PER_STRATUM" --max-new "$MAX_NEW" --max-targets "$MAX_TARGETS"
      - name: Save only historical research evidence checkpoint
        if: always()
        run: |
          if [ -f data/game_evidence_v117/evidence.csv ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/game_evidence_v117/evidence.csv
            if ! git diff --cached --quiet; then
              git commit -m 'research: expand historical ESPN evidence V120 [skip ci]'
              git push
            fi
          fi
      - name: Upload V120 research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: courtside-v120-coverage-sensitivity
          path: |
            data/research_v120/summary.json
            data/research_v120/report.md
            data/research_v120/predictions.csv
          if-no-files-found: warn
