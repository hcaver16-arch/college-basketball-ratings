name: Validate V140 interactive national bracket
on:
  workflow_dispatch:
  pull_request:
    paths:
      - bracketology_v138.py
      - tournament_ui_v140.py
      - test_tournament_ui_v140.py
      - .github/workflows/validate_tournament_ui_v140.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python -m py_compile bracketology_v138.py tournament_ui_v140.py
      - run: python test_tournament_ui_v140.py
      - run: python test_bracketology_v138.py
      - run: python test_tournament_resume_v139.py
