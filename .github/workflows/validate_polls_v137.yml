name: Validate V137 published polls
on:
  pull_request:
    paths:
      - app.py
      - published_polls_v137.py
      - test_polls_v137.py
      - .github/workflows/validate_polls_v137.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests
      - run: python -m py_compile app.py published_polls_v137.py
      - run: python test_polls_v137.py
