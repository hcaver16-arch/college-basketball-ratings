name: Validate tournament navigation tab
on:
  workflow_dispatch:
  pull_request:
    paths:
      - app.py
      - test_tournament_nav.py
      - .github/workflows/validate_tournament_nav.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile app.py
      - run: python test_tournament_nav.py
