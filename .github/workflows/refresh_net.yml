name: Refresh NCAA NET quadrant rankings
on:
  schedule:
    - cron: '25 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: courtside-net-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NET importer dependencies
        run: pip install requests beautifulsoup4
      - name: Fetch and validate NET snapshot
        run: python refresh_net.py
      - name: Commit validated snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p data/net
          git add -A data/net/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified NCAA NET ranking snapshots'
            git push
          fi
