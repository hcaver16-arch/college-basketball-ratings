name: Validate V134 forecast coverage
on:
  workflow_dispatch:
  pull_request:
    paths:
      - forecast_coverage_v134.py
      - opening_game_monitor_v133.py
      - test_forecast_coverage_v134.py
      - .github/workflows/validate_coverage_v134.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas
      - run: python -m py_compile forecast_coverage_v134.py opening_game_monitor_v133.py app.py
      - run: python test_forecast_coverage_v134.py
      - run: python test_opening_game_monitor_v133.py
