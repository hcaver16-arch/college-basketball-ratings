name: Validate V157 compact homepage
on:
  workflow_dispatch:
  pull_request:
    paths:
      - courtside_home.py
      - test_compact_home_v157.py
      - .github/workflows/validate_compact_home_v157.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile courtside_home.py
      - run: python test_compact_home_v157.py
