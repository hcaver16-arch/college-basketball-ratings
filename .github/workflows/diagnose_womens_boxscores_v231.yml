name: Diagnose V231 women's player boxscore mismatches
on:
  pull_request:
    paths:
      - boxscore_reconciliation_v231.py
      - player_stats_import.py
      - player_stats_v228.py
      - test_player_stats_v231.py
      - .github/workflows/diagnose_womens_boxscores_v231.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install 'pandas>=2.1,<3' 'numpy>=1.26,<3' 'requests>=2.31,<3'
      - name: Parser regression
        run: |
          python -m py_compile boxscore_reconciliation_v231.py
          python test_player_stats_v228.py
      - name: Inspect missing athlete rows in incomplete ESPN women's boxscores
        run: python boxscore_reconciliation_v231.py --max-games 12
