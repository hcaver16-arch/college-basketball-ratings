name: Validate V169 games-first homepage
on:
  pull_request:
    paths:
      - courtside_home.py
      - test_games_first_home_v169.py
      - .github/workflows/validate_games_first_home_v169.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile courtside_home.py
      - run: python test_games_first_home_v169.py
      - run: python test_compact_home_v157.py
      - run: python test_header_spacing_v161.py
      - run: python test_above_fold_v158.py
