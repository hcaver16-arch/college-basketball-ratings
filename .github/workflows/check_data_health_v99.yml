name: Check Courtside data health V99
on:
  workflow_dispatch:
  schedule:
    - cron: '40 0,6,12,18 * * *'
permissions:
  contents: write
concurrency:
  group: courtside-v99-health
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests pandas
      - name: Run data health checks
        id: health
        shell: bash
        run: |
          python -m py_compile reliability_v99.py prospective_archive_v97.py
          python reliability_v99.py --season 2026-27
          echo '## Courtside V99 data health' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/prospective/2026-27/health_v99.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Save health report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/prospective/2026-27/health_v99.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Courtside data health V99'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Flag critical health issues
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='data/prospective/2026-27/health_v99.json'
          d=json.load(open(p))
          if d['status']=='critical':
              raise SystemExit('Critical Courtside data-health issue: inspect report in Actions summary')
          PY
