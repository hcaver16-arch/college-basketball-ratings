name: Validate V154 top settings menu
on:
  workflow_dispatch:
  pull_request:
    paths:
      - app.py
      - test_settings_menu_v154.py
      - .github/workflows/validate_settings_menu_v154.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile app.py
      - run: python test_settings_menu_v154.py
