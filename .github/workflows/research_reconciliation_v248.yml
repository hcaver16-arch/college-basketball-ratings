name: Courtside V248 snapshot reconciliation research
on:
  pull_request:
    paths:
      - 'research_reconciliation_v248.py'
      - 'test_research_reconciliation_v248.py'
      - '.github/workflows/research_reconciliation_v248.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - run: python -m unittest test_research_reconciliation_v248.py test_research_rating_updates_v247.py
  research:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - name: Reconcile historical snapshots with final-game archive without writing production data
        run: python research_reconciliation_v248.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: courtside-v248-reconciliation
          path: |
            data/research_reconciliation_v248/summary.json
            data/research_reconciliation_v248/*_reconciliation.csv
            data/research_reconciliation_v248/*_exceptions.csv
          if-no-files-found: warn
