name: Validate V228 Players page and boxscore collector
on:
  pull_request:
    paths:
      - app.py
      - home_insights_v219.py
      - player_stats_v228.py
      - player_stats_ui_v228.py
      - player_stats_import.py
      - test_player_stats_v228.py
      - .github/workflows/collect_player_stats_v228.yml
      - .github/workflows/validate_player_stats_v228.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pandas>=2.1,<3" "numpy>=1.26,<3" "requests>=2.31,<3"
      - run: python -m py_compile app.py home_insights_v219.py player_stats_v228.py player_stats_ui_v228.py player_stats_import.py
      - run: python test_player_stats_v228.py
      - run: python test_home_insights_v219.py
      - run: python test_home_unified_v221.py
      - run: python test_home_tiles_v223.py
      - run: python test_home_spacing_v222.py
      - run: python test_mobile_filters_v225.py
      - run: python test_games_first_home_v169.py
