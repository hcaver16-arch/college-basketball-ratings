name: Validate V175 live homepage
on:
  pull_request:
    paths:
      - app.py
      - courtside_home.py
      - test_live_home_v175.py
      - .github/workflows/validate_live_home_v175.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile app.py courtside_home.py
      - run: python test_live_home_v175.py
      - run: python test_theme_v153.py
      - run: python test_performance_v130.py
