name: Validate V198 balanced team overview
on:
  pull_request:
    paths:
      - team_profile_ui.py
      - test_team_overview_v198.py
      - .github/workflows/validate_team_overview_v198.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python -m py_compile team_profile_ui.py test_team_overview_v198.py
      - run: python test_team_overview_v198.py
