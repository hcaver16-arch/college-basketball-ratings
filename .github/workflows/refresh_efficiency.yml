name: Refresh experimental efficiencies
on:
  workflow_dispatch:
  schedule:
    - cron: '40 11 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install calculation dependencies
        run: python -m pip install pandas numpy requests
      - name: Collect paired finals and fit adjusted efficiencies
        run: python refresh_efficiency.py --sport both --days 14
      - name: Commit new validated data only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/efficiency/ || true
          if ! git diff --cached --quiet; then
            git commit -m 'Update experimental efficiency data'
            git push
          fi
