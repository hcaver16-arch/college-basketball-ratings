name: Refresh basketball power ratings
on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *' # 12:30 UTC daily; Actions timing is not guaranteed
permissions:
  contents: write
concurrency:
  group: basketball-ratings
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Calculate and archive both divisions
        run: python daily_ratings.py --sport both
      - name: Commit refreshed ratings and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ratings/
          if ! git diff --cached --quiet; then
            git commit -m "Update daily basketball power ratings"
            git push
          else
            echo "No rating changes"
          fi
