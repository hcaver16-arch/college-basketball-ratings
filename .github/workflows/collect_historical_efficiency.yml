name: Collect historical efficiency data
on:
  workflow_dispatch:
  schedule:
    - cron: '29 7 * * *'
permissions:
  contents: write
concurrency:
  group: historical-efficiency-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pandas requests
      - name: Collect historical paired final box scores
        run: python collect_historical_efficiency.py --sport both --batch-days 3
      - name: Commit collected data and progress
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/historical_efficiency/
          if ! git diff --cached --quiet; then
            git commit -m 'Archive verified historical efficiency games'
            git push
          fi
