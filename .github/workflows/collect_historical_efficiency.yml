name: Collect historical efficiency data

on:
  workflow_dispatch:
    inputs:
      max_batches:
        description: 'Maximum 10-day batches per run (20 covers the 2025-26 season)'
        required: false
        default: '20'
        type: choice
        options: ['1', '5', '10', '20']
  schedule:
    - cron: '29 7 * * *'

permissions:
  contents: write

# A second manual click will not run concurrently and overwrite progress.
concurrency:
  group: historical-efficiency-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pandas requests
      - name: Set Git commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Collect remaining season in resumable batches
        env:
          MAX_BATCHES: ${{ github.event.inputs.max_batches || '20' }}
        shell: bash
        run: |
          set -euo pipefail
          
          save_progress() {
            git add data/historical_efficiency/
            if ! git diff --cached --quiet; then
              git commit -m 'Archive verified historical efficiency games'
              git push origin HEAD:main
            fi
          }
          
          for ((batch=1; batch<=MAX_BATCHES; batch++)); do
            echo "::group::Historical collection batch ${batch}/${MAX_BATCHES}"
            # Collector saves checkpoints each day. Commit even after an API error.
            if python collect_historical_efficiency.py --sport both --batch-days 10; then
              save_progress
            else
              save_progress
              echo 'Collection stopped because of a fetch or validation error. Saved completed dates; rerun later.' >&2
              exit 1
            fi
            
            if python - <<'PY'
          import datetime as dt, json
          from pathlib import Path
          end = dt.date(2026, 4, 15)
          root = Path('data/historical_efficiency')
          complete = True
          for division in ('mens', 'womens'):
              path = root / f'2025-26_{division}_collection_status.json'
              state = json.loads(path.read_text()) if path.exists() else {}
              last = state.get('last_completed_date')
              done = bool(last and dt.date.fromisoformat(last) >= end)
              print(f'{division}: last completed date = {last or "not started"}; done = {done}')
              complete = complete and done
          raise SystemExit(0 if complete else 1)
          PY
            then
              echo 'Both divisions complete through April 15, 2026.'
              echo '## Historical collection complete' >> "$GITHUB_STEP_SUMMARY"
              echo 'Both divisions processed dates through April 15, 2026.' >> "$GITHUB_STEP_SUMMARY"
              echo 'Check missing-box-score coverage before treating the archive as complete.' >> "$GITHUB_STEP_SUMMARY"
              echo '::endgroup::'
              exit 0
            fi
            echo '::endgroup::'
          done
          echo 'Stopped at the configured batch limit. Progress is saved; manually rerun to continue.'
          echo '## Partial historical collection' >> "$GITHUB_STEP_SUMMARY"
          echo 'The configured batch limit was reached. Progress has been committed; rerun if needed.' >> "$GITHUB_STEP_SUMMARY"
