name: Validate V230 newcomer hold diagnostics
on:
  pull_request:
    paths:
      - prediction_archive.py
      - forecast_coverage_v134.py
      - test_newcomer_forecast_diagnostics_v230.py
      - .github/workflows/validate_newcomer_forecast_v230.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pandas>=2.1,<3' 'numpy>=1.26,<3' 'requests>=2.31,<3'
      - run: python -m py_compile prediction_archive.py forecast_coverage_v134.py
      - run: python test_newcomer_forecast_diagnostics_v230.py
      - run: python test_forecast_coverage_v134.py
      - run: python test_transition_research_v227.py
