name: Track paired prospective roster experiment V109
on:
  workflow_dispatch:
  schedule:
    - cron: '20 12,18 * * *'
permissions:
  contents: write
concurrency:
  group: courtside-v97-prospective
  cancel-in-progress: false
jobs:
  paired-research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas requests
      - name: Create fresh V97 pregame forecasts and collect final scores
        run: python prospective_archive_v97.py --season 2026-27
      - name: Lock V109 paired predictions and compare available final scores
        run: |
          python prospective_roster_eval_v109.py --season 2026-27
          echo '## V109 paired prospective experiment' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/prospective/2026-27/roster_evaluation_v109.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit appended research records
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/prospective/2026-27/forecasts.csv data/prospective/2026-27/results.csv data/prospective/2026-27/summary.json data/prospective/2026-27/roster_pairs_v109.csv data/prospective/2026-27/roster_evaluation_v109.json
          if ! git diff --cached --quiet; then
            git commit -m 'Track V97 forecasts and paired V109 roster experiment'
            git push
          fi
