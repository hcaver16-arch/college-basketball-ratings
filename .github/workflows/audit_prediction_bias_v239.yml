name: V239 research-only early-season prediction bias audit
on:
  pull_request:
    paths:
      - early_season_bias_v239.py
      - test_early_season_bias_v239.py
      - .github/workflows/audit_prediction_bias_v239.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'requests>=2.31,<3'
      - name: Run no-leakage and production-preservation regressions
        run: |
          python -m py_compile early_season_bias_v239.py test_early_season_bias_v239.py
          python test_early_season_bias_v239.py
          python test_early_season_calibration_v238.py
          python test_prior_transition_v229.py
          python test_rating_reliability_v181.py
          python test_top25_rating_change_v232.py
      - name: Analyze saved early-season scores for men and women
        run: python early_season_bias_v239.py --root . --out /tmp/v239-bias-readonly
      - name: Summarize paired bias findings
        run: |
          python - <<'PY'
          import json, os
          s=json.load(open('/tmp/v239-bias-readonly/summary.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('## V239 calibration bias — research only, not deployed\n\n')
            f.write('**Retrospective same-date held-out replay, not genuine saved pretip forecasts.**\n\n')
            f.write('| Division | Same D1 games | Legacy MAE | Legacy signed home-margin bias | Anchored cap 20 MAE | Cap 40 MAE | Cap 60 MAE | Home sites | Neutral sites |\n')
            f.write('|---|---:|---:|---:|---:|---:|---:|---:|---:|\n')
            for sport, d in s['divisions'].items():
              m=d['overall_model_metrics']
              h=d['non_neutral_intercept_only_hca_sensitivity']
              neutral=h['neutral_games_control_count']
              f.write(f"| {sport} | {d['matched_games']} | {m['legacy_replay']['mae']} | {m['legacy_replay']['signed_bias']} | {m['anchored_cap20']['mae']} | {m['anchored_ridge8']['mae']} | {m['anchored_cap60']['mae']} | {h['baseline_3']['games']} | {neutral} |\n")
            f.write('\n**Important:** +0/+5-point home adjustments are intercept-only sensitivities holding fitted ratings fixed, NOT a validated HCA correction.\n')
            f.write('The >40 margin breakdown is an after-game diagnostic, not a pregame feature.\n')
            f.write('Breakdown CSVs cover opponent quality, preseason strength, favorite side, venue, prior gap, early games, and blowout outcomes.\n')
            f.write('Model settings were not selected on an independent holdout. No official rating/forecast/UI modification.\n')
          PY
      - name: Preserve research-only diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v239-bias-calibration-audit
          path: /tmp/v239-bias-readonly/
          if-no-files-found: warn
