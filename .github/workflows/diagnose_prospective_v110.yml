name: Diagnose prospective V97 to V109 collection V110
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnose saved V97 and V109 data without creating forecasts
        run: |
          python diagnose_prospective_v110.py --season 2026-27
          echo '## V110 read-only collection diagnosis' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/prospective/2026-27/diagnostics_v110.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit diagnostic report only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/prospective/2026-27/diagnostics_v110.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save V110 prospective collection diagnostic'
            git push
          fi
