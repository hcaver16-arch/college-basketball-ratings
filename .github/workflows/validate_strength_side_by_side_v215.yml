name: Validate V215 simultaneous SOS and SOR
on:
  pull_request:
    paths:
      - app.py
      - strength_pages_ui.py
      - strength_comparison_v215.py
      - test_strength_navigation_v214.py
      - test_strength_side_by_side_v215.py
      - .github/workflows/validate_strength_side_by_side_v215.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pandas>=2.1,<3"
      - run: python -m py_compile app.py strength_pages_ui.py strength_comparison_v215.py
      - run: python test_strength_navigation_v214.py
      - run: python test_strength_side_by_side_v215.py
      - run: python test_compact_nav_v159.py
