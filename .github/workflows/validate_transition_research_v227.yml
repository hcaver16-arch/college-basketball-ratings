name: Validate V227 transition research and forecast safety
on:
  pull_request:
    paths:
      - transition_research_v227.py
      - app.py
      - prediction_archive.py
      - prospective_archive_v97.py
      - bracketology_v138.py
      - test_transition_research_v227.py
      - .github/workflows/audit_transition_research_v227.yml
      - .github/workflows/validate_transition_research_v227.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pandas>=2.1,<3" "numpy>=1.26,<3" "requests>=2.31,<3"
      - run: python -m py_compile transition_research_v227.py app.py prediction_archive.py prospective_archive_v97.py bracketology_v138.py
      - run: python test_transition_research_v227.py
      - run: python test_data_health_v226.py
      - run: python test_bracketology_v138.py
      - run: python test_game_rating_labels_v188.py
