name: Research venue-aware sensitivity V119
on:
  workflow_dispatch:
    inputs:
      max_games_per_stratum:
        description: 'Late checkpoint games per season/division; max 200'
        required: false
        default: '60'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install solver
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Run isolated historical sensitivity
        env:
          MAX_GAMES: ${{ inputs.max_games_per_stratum }}
        run: |
          python venue_sensitivity_v119.py --max-games-per-stratum "${MAX_GAMES:-60}" --output data/sensitivity_v119
      - name: Upload report (no commits)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: courtside-v119-venue-sensitivity-report
          path: data/sensitivity_v119/
          if-no-files-found: warn
