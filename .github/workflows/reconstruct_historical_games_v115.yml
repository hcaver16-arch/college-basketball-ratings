name: Research historical game reconstruction V115
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnose and normalize historical game evidence
        run: python reconstruct_games_v115.py
      - name: Upload research-only diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: courtside-v115-reconstruction-report
          path: data/historical_reconstruction_v115/
          if-no-files-found: error
