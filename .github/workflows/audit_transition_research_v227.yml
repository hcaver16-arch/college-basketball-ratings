name: Audit D1 newcomers (research only) V227
on:
  workflow_dispatch:
  schedule:
    - cron: '45 15 * * 1' # weekly Monday, after the saved daily rating refresh
permissions:
  contents: write
concurrency:
  group: courtside-transition-research-v227
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pandas>=2.1,<3" "numpy>=1.26,<3" "requests>=2.31,<3"
      - name: Check research logic before collecting data
        run: |
          python -m py_compile transition_research_v227.py
          python test_transition_research_v227.py
      - name: Review ESPN D1 membership, on-court evidence and baseline gaps
        run: python transition_research_v227.py
      - name: Save research-only report (never ratings or official forecasts)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/transition_research_v227/
          if ! git diff --cached --quiet; then
            git commit -m 'Update V227 D1 newcomer research audit'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
