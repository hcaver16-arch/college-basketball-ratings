name: Validate V130 performance diagnostics
on:
  workflow_dispatch:
  pull_request:
    paths:
      - app.py
      - test_performance_v130.py
      - .github/workflows/validate_performance_v130.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile app.py
      - run: python test_performance_v130.py
