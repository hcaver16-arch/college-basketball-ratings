name: Validate V218 Model Lab dashboard
on:
  pull_request:
    paths:
      - app.py
      - model_lab_center_v218.py
      - test_model_lab_dashboard_v218.py
      - .github/workflows/validate_model_lab_dashboard_v218.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pandas>=2.1,<3"
      - run: python -m py_compile app.py model_lab_center_v218.py
      - run: python test_model_lab_dashboard_v218.py
      - run: python test_compact_nav_v159.py
      - run: python test_strength_navigation_v214.py
