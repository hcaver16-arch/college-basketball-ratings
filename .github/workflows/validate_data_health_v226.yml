name: Validate V226 health-monitor classification and archival checks
on:
  pull_request:
    paths:
      - reliability_v99.py
      - test_data_health_v226.py
      - .github/workflows/check_data_health_v99.yml
      - .github/workflows/validate_data_health_v226.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pandas>=2.1,<3" "requests>=2.31,<3"
      - run: python -m py_compile reliability_v99.py prospective_archive_v97.py
      - run: python test_data_health_v226.py
