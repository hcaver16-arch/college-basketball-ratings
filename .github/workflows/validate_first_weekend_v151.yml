name: Validate V151 first-weekend sites
on:
  pull_request:
    paths:
      - tournament_first_weekend_v151.py
      - tournament_full_v144.py
      - tournament_native_v142.py
      - test_first_weekend_v151.py
      - .github/workflows/validate_first_weekend_v151.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python -m py_compile tournament_first_weekend_v151.py tournament_full_v144.py tournament_native_v142.py
      - run: python test_first_weekend_v151.py
