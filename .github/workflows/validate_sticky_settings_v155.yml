name: Validate V155 sticky settings
on:
  pull_request:
    paths:
      - app.py
      - test_sticky_settings_v155.py
      - .github/workflows/validate_sticky_settings_v155.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile app.py
      - run: python test_sticky_settings_v155.py
