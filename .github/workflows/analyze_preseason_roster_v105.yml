name: Analyze preseason roster sensitivity V105
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pandas
      - name: Analyze saved roster evidence (never changes live ratings)
        run: python preseason_roster_experiment_v105.py
      - name: Print summary
        run: cat data/roster_experiment_v105/summary.json
      - name: Commit research outputs only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/roster_experiment_v105/
          if ! git diff --cached --quiet; then
            git commit -m 'Update V105 research-only roster sensitivity'
            git pull --rebase origin main
            git push
          fi
