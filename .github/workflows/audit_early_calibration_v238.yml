name: V238 read-only early-season calibration audit
on:
  pull_request:
    paths:
      - early_season_calibration_v238.py
      - test_early_season_calibration_v238.py
      - .github/workflows/audit_early_calibration_v238.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical and membership dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'requests>=2.31,<3'
      - name: Validate syntax and no-leakage model regression
        run: |
          python -m py_compile early_season_calibration_v238.py test_early_season_calibration_v238.py
          python test_early_season_calibration_v238.py
          python test_rating_reliability_v181.py
          python test_prior_transition_v229.py
          python test_top25_rating_change_v232.py
      - name: Audit saved results and rankings for both divisions
        run: python early_season_calibration_v238.py --root . --out /tmp/v238-early-calibration
      - name: Publish brief evaluation to job summary
        run: |
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/v238-early-calibration/summary.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('## V238 early-season rating calibration (RESEARCH ONLY)\n\n')
            f.write('**Retrospective day-before replay only. Not prospective; do not use to promote any variant.**\n\n')
            f.write('| Division | Matched verified D1 | Informative | Legacy MAE | Anchor 4 MAE | Anchor 8 MAE | Anchor 16 MAE | 25+ wins with legacy drop |\n')
            f.write('|---|---:|---:|---:|---:|---:|---:|---:|\n')
            for name, data in d['divisions'].items():
              e=data['comparison']; m=e['metrics_same_games']; w=data['strong_wins']
              f.write(f"| {name} | {e['matched_d1_games']} | {e['informative_model_disagreement_games']} | {m['legacy_replay']['mae']} | {m['anchored_ridge4']['mae']} | {m['anchored_ridge8']['mae']} | {m['anchored_ridge16']['mae']} | {w['legacy_declines_after_25_plus_win']} |\n")
            f.write('\nDifferent preseason anchors are fixed hypotheses. Scores from target day D are never used to predict D.\n')
            f.write('Source SHA-256 per division, watchlists, same-match pair files and after-day strong-win diagnostics are in the run artifact.\n')
            f.write('**No live rating, predictions, or public rankings changed.**\n')
          PY
      - name: Preserve comprehensive research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v238-early-calibration-readonly-report
          path: /tmp/v238-early-calibration/
          if-no-files-found: warn
