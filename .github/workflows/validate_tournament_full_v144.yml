name: Validate V144 full tournament bracket
on:
  workflow_dispatch:
  pull_request:
    paths:
      - tournament_full_v144.py
      - tournament_native_v142.py
      - test_tournament_full_v144.py
      - .github/workflows/validate_tournament_full_v144.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tournament_full_v144.py tournament_native_v142.py
      - run: python test_tournament_full_v144.py
