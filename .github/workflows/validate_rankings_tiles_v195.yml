name: Validate V195 rankings tiles
on:
  pull_request:
    paths:
      - rankings_ui.py
      - test_rankings_tiles_v195.py
      - .github/workflows/validate_rankings_tiles_v195.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python -m py_compile rankings_ui.py test_rankings_tiles_v195.py
      - run: python test_rankings_tiles_v195.py
