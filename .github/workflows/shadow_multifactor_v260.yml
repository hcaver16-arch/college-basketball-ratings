name: V260 shadow multifactor model - independent forecasts
on:
  pull_request:
    paths:
      - shadow_multifactor_v260.py
      - shadow_coaches_v260.py
      - test_shadow_multifactor_v260.py
      - .github/workflows/shadow_multifactor_v260.yml
      - docs/V260_SHADOW_MULTIFACTOR.md
  workflow_dispatch:
  schedule:
    # Three independent snapshots per day; after daily official ratings
    # (12:30 UTC) and player-boxscore collection (14:40 UTC).
    - cron: '17 15,19,23 * * *'
permissions:
  contents: write
concurrency:
  group: courtside-v260-multifactor-shadow
  cancel-in-progress: false
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling and data dependencies
        run: python -m pip install 'pandas>=2.1,<3' 'numpy>=1.26,<3' 'requests>=2.31,<3'
      - name: Test model inputs, factor bounds, same-day leakage and immutable forecasts
        run: |
          python -m py_compile shadow_coaches_v260.py shadow_multifactor_v260.py test_shadow_multifactor_v260.py
          python test_shadow_multifactor_v260.py
          python test_early_season_calibration_v238.py
          python test_prior_transition_v229.py
          python test_rating_reliability_v181.py
      - name: Read-only smoke against saved men's and women's archives
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import pandas as pd
          from shadow_multifactor_v260 import build_snapshot, SPORTS
          root = Path(".").resolve()
          before = sorted(str(p) for p in root.glob("data/shadow_multifactor_v260/2026-27/**/*") if p.is_file())
          for sport in SPORTS:
              # This is a READ-ONLY file-schema smoke: historical V105
              # covered team IDs are NOT used as verified D1 membership
              # for any actual shadow forecast or claim of D1 accuracy.
              source = pd.read_csv(
                  root/"data"/"roster_experiment_v105"/
                  f"{sport}_experimental_roster_sensitivity.csv",
                  dtype={"team_id":str})
              ids = set(source["team_id"].dropna().astype(str))
              teams, summary = build_snapshot(root, sport,
                  datetime.now(timezone.utc), d1_ids=ids, coaches={})
              assert len(teams) >= 200
              assert summary["source_sha256"]["saved_ratings"] != "missing"
              assert summary["source_sha256"]["current_players"] != "missing"
              assert summary["source_sha256"]["previous_stats"] != "missing"
              print(sport, {
                  "rated_teams_smoke_not_verified_D1": len(teams),
                  "talent_covered": summary["roster_proxy_coverage"],
                  "minute_covered": summary["playing_time_proxy_coverage"],
                  "earlier_ET_final_games": summary["on_court_archived_d1_finals_older_than_today_et"],
              })
          after = sorted(str(p) for p in root.glob("data/shadow_multifactor_v260/2026-27/**/*") if p.is_file())
          assert before == after, "Read-only shadow integration wrote files"
          PY
      - name: Calculate shadow ratings and lock first pretip forecasts
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python shadow_multifactor_v260.py --root . --season 2026-27
      - name: Summarize shadow feature coverage and paired accuracy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import json, os
          s=json.load(open('data/shadow_multifactor_v260/2026-27/summary.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('## V260: multifactor shadow model (NOT OFFICIAL)\n\n')
            f.write('Separate append-only first forecasts. All optional factor coefficients are untrained assumptions.\n\n')
            f.write('| Division | Rated D1 | Roster talent covered | Verified recent player minutes | Coach continuity verified | New pretip locks | Paired with official and graded |\n')
            f.write('|---|---:|---:|---:|---:|---:|---:|\n')
            for div,d in s['divisions'].items():
              paired=s['comparison_with_immutable_official_forecasts'][div]['same_game_paired_shadow']
              f.write(f"| {div} | {d['all_verified_d1_rated_teams']} | {d['roster_proxy_coverage']} | {d['playing_time_proxy_coverage']} | {d['coach_continuity_verified']} | {d['new_immutable_forecasts']} | {paired['games']} |\n")
            f.write('\nCoach coverage is STRICTLY explicit season-specific head-coach metadata; zero verified means coach component disabled, not zero coaching value.\n')
            f.write('No model promotion, daily rating change, website change or edits to V97.\n')
          PY
      - name: Commit ONLY shadow model evidence and immutable forecast journal
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/shadow_multifactor_v260/2026-27/
          if git diff --cached --quiet; then
            echo "No shadow archive changes"
            exit 0
          fi
          git commit -m "Update isolated V260 shadow model snapshots and first forecasts"
          git pull --rebase origin main
          git push origin HEAD:main
