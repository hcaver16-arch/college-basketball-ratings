name: Validate V233 anchored prospective research and rating movements
on:
  pull_request:
    paths:
      - anchored_snapshot_v233.py
      - paired_anchor_eval_v233.py
      - rating_movement_v233.py
      - prospective_archive_v97.py
      - rankings_ui.py
      - prospective_model_lab_v98.py
      - team_profile_ui.py
      - app.py
      - test_anchored_parallel_v233.py
      - .github/workflows/track_prospective_v97.yml
      - .github/workflows/validate_anchored_v233.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'requests>=2.31,<3'
      - name: Check syntax on model, archive, app and display
        run: |
          python -m py_compile anchored_snapshot_v233.py paired_anchor_eval_v233.py rating_movement_v233.py prospective_archive_v97.py rankings_ui.py prospective_model_lab_v98.py team_profile_ui.py app.py
      - name: Verify true pregame snapshots and immutable pairing
        run: python test_anchored_parallel_v233.py
      - name: Preserve official rating engine behavior
        run: |
          python test_rating_reliability_v181.py
          python test_prior_transition_v229.py
      - name: Validate compact rankings tiles and D1 scope
        run: python test_rankings_tiles_v195.py
