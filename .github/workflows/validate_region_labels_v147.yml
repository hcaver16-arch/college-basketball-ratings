name: Validate V147 regional bracket seeds and sites
on:
  pull_request:
    paths:
      - tournament_region_labels_v147.py
      - tournament_native_v142.py
      - tournament_full_v144.py
      - bracketology_v138.py
      - test_region_labels_v147.py
      - .github/workflows/validate_region_labels_v147.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas
      - run: python test_region_labels_v147.py
      - run: python -m py_compile tournament_region_labels_v147.py tournament_native_v142.py tournament_full_v144.py bracketology_v138.py
