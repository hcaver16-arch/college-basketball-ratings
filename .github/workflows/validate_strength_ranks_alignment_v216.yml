name: Validate V216 Strength ranks and alignment
on:
  pull_request:
    paths:
      - strength_comparison_v215.py
      - test_strength_side_by_side_v215.py
      - test_strength_ranks_alignment_v216.py
      - .github/workflows/validate_strength_ranks_alignment_v216.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pandas>=2.1,<3"
      - run: python -m py_compile strength_comparison_v215.py
      - run: python test_strength_side_by_side_v215.py
      - run: python test_strength_ranks_alignment_v216.py
