name: Analyze transfer origins and prior production V104
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze-origins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pandas
        run: python -m pip install pandas
      - name: Analyze existing saved rosters
        run: python transfer_origin_v104.py
      - name: Print summary
        run: cat data/transfer_origin_v104/summary.json
      - name: Commit research output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/transfer_origin_v104/
          if ! git diff --cached --quiet; then
            git commit -m 'Update V104 player origin research'
            git pull --rebase origin main
            git push
          fi
