name: Validate adjusted efficiency snapshots
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas streamlit
      - run: python -m unittest test_adjusted_snapshot_cutoff
