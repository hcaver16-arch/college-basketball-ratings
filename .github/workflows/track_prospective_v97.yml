name: Archive pregame forecasts and outcomes V97
on:
  workflow_dispatch:
  schedule:
    # 08:15 and 14:15 UTC; pregame snapshot recorded only if tipoff is >30 min away.
    - cron: '15 12,18 * * *'
permissions:
  contents: write
concurrency:
  group: courtside-v97-prospective
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python packages
        run: pip install pandas numpy requests
      - name: Generate V233 experimental preseason-anchored snapshot
        # The official archive is more important than research: on a source
        # failure, V97 still records official forecasts. V233's loader rejects
        # stale experimental snapshots using source hashes + official timestamp.
        continue-on-error: true
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m py_compile anchored_snapshot_v233.py
          python anchored_snapshot_v233.py --root . --sport both
      - name: Lock eligible pregame predictions and grade completed games
        run: |
          python -m py_compile prospective_archive_v97.py
          python prospective_archive_v97.py --season 2026-27
          {
            echo '## Courtside prospective V97'
            echo 'First eligible predictions are immutable. Final scores stored separately.'
            echo '```json'
            cat data/prospective/2026-27/summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Evaluate matched experimental vs official pre-tip forecasts
        run: |
          python paired_anchor_eval_v233.py --root . --season 2026-27
          {
            echo '## V233 paired research, not production'
            echo 'No forecasts were backfilled; only saved pregame pairs are evaluated.'
            echo '```json'
            cat data/prospective/2026-27/anchored_evaluation_v233.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the append-only archive
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/prospective/2026-27/forecasts.csv data/prospective/2026-27/results.csv data/prospective/2026-27/summary.json data/prospective/2026-27/anchored_pairs_v233.csv data/prospective/2026-27/anchored_evaluation_v233.json
          if test -d data/prospective/experimental_ratings/; then
            git add -- data/prospective/experimental_ratings/
          fi
          if git diff --cached --quiet; then
            echo 'No archive changes'
            exit 0
          fi
          git commit -m 'Archive immutable official and V233 experimental forecasts'
          git pull --rebase origin main
          git push origin HEAD:main
