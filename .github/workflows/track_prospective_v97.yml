name: Archive pregame forecasts and outcomes V97
on:
  workflow_dispatch:
  schedule:
    # 08:15 and 14:15 UTC; pregame snapshot recorded only if tipoff is >30 min away.
    - cron: '15 12,18 * * *'
permissions:
  contents: write
concurrency:
  group: courtside-v97-prospective
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python packages
        run: pip install pandas requests
      - name: Lock eligible pregame predictions and grade completed games
        run: |
          python -m py_compile prospective_archive_v97.py
          python prospective_archive_v97.py --season 2026-27
          {
            echo '## Courtside prospective V97'
            echo 'First eligible predictions are immutable. Final scores stored separately.'
            echo '```json'
            cat data/prospective/2026-27/summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the append-only archive
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/prospective/2026-27/forecasts.csv data/prospective/2026-27/results.csv data/prospective/2026-27/summary.json
          if git diff --cached --quiet; then
            echo 'No archive changes'
            exit 0
          fi
          git commit -m 'Archive prospective Courtside predictions and finals V97'
          git push
