name: Validate V197 Tournament tabs and team locations
on:
  pull_request:
    paths:
      - bracketology_v138.py
      - tournament_native_v142.py
      - tournament_locations_v145.py
      - test_tournament_tabs_v197.py
      - .github/workflows/validate_tournament_tabs_v197.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python -m py_compile bracketology_v138.py tournament_native_v142.py tournament_locations_v145.py test_tournament_tabs_v197.py
      - run: python test_tournament_tabs_v197.py
