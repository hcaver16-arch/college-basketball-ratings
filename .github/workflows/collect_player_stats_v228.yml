name: Collect verified player box scores V228
on:
  workflow_dispatch:
  schedule:
    - cron: '40 14 * * *' # 14:40 UTC, daily after the saved-rating refresh
permissions:
  contents: write
concurrency:
  group: courtside-players-v228
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data dependencies
        run: python -m pip install "pandas>=2.1,<3" "numpy>=1.26,<3" "requests>=2.31,<3"
      - name: Validate parser, coverage and archive safeguards
        run: |
          python -m py_compile player_stats_v228.py player_stats_ui_v228.py player_stats_import.py
          python test_player_stats_v228.py
          python test_player_stats_v231.py
      - name: Collect 2026-27 ESPN D1 player box scores
        run: python player_stats_v228.py
      - name: Summarize observed box-score coverage
        run: |
          python - <<'PY'
          import json, pathlib, os
          p=pathlib.Path("data/player_stats_v228/2026-27/summary.json")
          result=json.loads(p.read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], "a") as f:
              f.write("## Courtside V228 player box-score coverage\n\n")
              f.write("| Division | Verified box scores | Discovered | Observed coverage | Leaders available |\n|---|---:|---:|---:|---|\n")
              for sport, report in result["divisions"].items():
                  f.write(f"| {sport} | {report['verified_d1_team_game_boxscores']} | {report['discovered_d1_team_game_boxscores']} | {report['observed_boxscore_coverage']:.1%} | {report['player_leaders_publishable']} |\n")
          PY
      - name: Commit only player archives and audit reports
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/player_stats_v228/2026-27/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified 2026-27 player box scores V228'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
