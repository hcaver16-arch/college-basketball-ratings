name: Validate V186 Games visuals
on:
  pull_request:
    paths:
      - app.py
      - test_games_visual_v186.py
      - .github/workflows/validate_games_visual_v186.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile app.py
      - run: python test_games_visual_v186.py
      - run: python test_games_polish_v183.py
