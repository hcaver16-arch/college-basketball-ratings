name: Validate V136 game time zones
on:
  workflow_dispatch:
  pull_request:
    paths:
      - app.py
      - courtside_home.py
      - game_timezones_v136.py
      - test_timezones_v136.py
      - .github/workflows/validate_timezones_v136.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas
      - run: python test_timezones_v136.py
      - run: python -m py_compile app.py courtside_home.py game_timezones_v136.py
